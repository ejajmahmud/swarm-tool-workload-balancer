[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-tool-workload-balancer"
version = "0.1.0"
description = "Adaptive round-robin and least-connection load balancing across identical tool worker agent replicas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-tool-workload-balancer = "swarm_tool_workload_balancer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_tool_workload_balancer*"]
